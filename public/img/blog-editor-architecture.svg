<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#FF9900"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#66BB6A"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9C27B0"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1976D2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="680" fill="#fafbfc" rx="8"/>

  <!-- Title -->
  <rect x="0" y="0" width="960" height="44" rx="8" fill="url(#headerGrad)"/>
  <rect x="0" y="20" width="960" height="24" fill="url(#headerGrad)"/>
  <text x="480" y="28" text-anchor="middle" fill="white" font-size="16" font-weight="bold">astro-blog &amp; blog-editor 構成図</text>

  <!-- ============ astro-blog group ============ -->
  <rect x="20" y="60" width="420" height="250" rx="10" fill="white" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="60" width="420" height="32" rx="10" fill="#1E1E3F"/>
  <rect x="20" y="80" width="420" height="12" fill="#1E1E3F"/>
  <text x="230" y="81" text-anchor="middle" fill="white" font-size="13" font-weight="bold">astro-blog（静的サイト）</text>

  <!-- Astro -->
  <rect x="35" y="102" width="120" height="36" rx="6" fill="#1E1E3F"/>
  <text x="95" y="124" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Astro 5</text>

  <!-- Content Collections -->
  <rect x="170" y="102" width="130" height="36" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1"/>
  <text x="235" y="118" text-anchor="middle" fill="#5d4037" font-size="9.5">Content Collections</text>
  <text x="235" y="131" text-anchor="middle" fill="#8d6e63" font-size="8.5">Markdown 記事</text>

  <!-- React -->
  <rect x="315" y="102" width="70" height="36" rx="6" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1"/>
  <text x="350" y="124" text-anchor="middle" fill="#1565c0" font-size="10" font-weight="bold">React 19</text>

  <!-- Row 2 -->
  <rect x="35" y="148" width="90" height="30" rx="5" fill="#e0f7fa" stroke="#26c6da" stroke-width="1"/>
  <text x="80" y="167" text-anchor="middle" fill="#00838f" font-size="9.5" font-weight="bold">Tailwind CSS 4</text>

  <rect x="135" y="148" width="70" height="30" rx="5" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1"/>
  <text x="170" y="162" text-anchor="middle" fill="#7b1fa2" font-size="9">OG画像生成</text>
  <text x="170" y="173" text-anchor="middle" fill="#9c27b0" font-size="7.5">Satori + resvg</text>

  <rect x="215" y="148" width="70" height="30" rx="5" fill="#fff3e0" stroke="#ffa726" stroke-width="1"/>
  <text x="250" y="167" text-anchor="middle" fill="#e65100" font-size="9.5">Pagefind</text>

  <rect x="295" y="148" width="50" height="30" rx="5" fill="#fff3e0" stroke="#ffa726" stroke-width="1"/>
  <text x="320" y="167" text-anchor="middle" fill="#e65100" font-size="9.5">RSS</text>

  <rect x="355" y="148" width="60" height="30" rx="5" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1"/>
  <text x="385" y="167" text-anchor="middle" fill="#283593" font-size="9.5">Sitemap</text>

  <!-- TypeScript -->
  <rect x="35" y="188" width="90" height="28" rx="5" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1"/>
  <text x="80" y="206" text-anchor="middle" fill="#1a237e" font-size="9.5">TypeScript 5</text>

  <!-- Output -->
  <rect x="35" y="232" width="390" height="32" rx="6" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="230" y="252" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="bold">dist/ （静的ファイル出力）</text>

  <!-- Build arrow inside astro-blog -->
  <line x1="95" y1="138" x2="95" y2="188" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ============ blog-editor group ============ -->
  <rect x="20" y="340" width="420" height="320" rx="10" fill="white" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="340" width="420" height="32" rx="10" fill="#000"/>
  <rect x="20" y="360" width="420" height="12" fill="#000"/>
  <text x="230" y="361" text-anchor="middle" fill="white" font-size="13" font-weight="bold">blog-editor（管理画面）</text>

  <!-- Next.js -->
  <rect x="35" y="382" width="140" height="36" rx="6" fill="#000"/>
  <text x="105" y="398" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Next.js 15</text>
  <text x="105" y="411" text-anchor="middle" fill="#aaa" font-size="8">App Router / Standalone</text>

  <!-- React + EasyMDE -->
  <rect x="190" y="382" width="60" height="36" rx="6" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1"/>
  <text x="220" y="404" text-anchor="middle" fill="#1565c0" font-size="10" font-weight="bold">React 19</text>

  <rect x="265" y="382" width="120" height="36" rx="6" fill="#e1f5fe" stroke="#4fc3f7" stroke-width="1"/>
  <text x="325" y="398" text-anchor="middle" fill="#0277bd" font-size="9.5">EasyMDE</text>
  <text x="325" y="411" text-anchor="middle" fill="#0288d1" font-size="8">Markdownエディタ</text>

  <!-- API Routes label -->
  <text x="35" y="436" fill="#666" font-size="10" font-style="italic">API Routes</text>

  <!-- API Route boxes -->
  <rect x="35" y="444" width="85" height="32" rx="5" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1"/>
  <text x="77" y="458" text-anchor="middle" fill="#1565c0" font-size="8.5">/api/posts</text>
  <text x="77" y="470" text-anchor="middle" fill="#1976d2" font-size="7.5">CRUD</text>

  <rect x="130" y="444" width="85" height="32" rx="5" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1"/>
  <text x="172" y="458" text-anchor="middle" fill="#1565c0" font-size="8.5">/api/images</text>
  <text x="172" y="470" text-anchor="middle" fill="#1976d2" font-size="7.5">アップロード</text>

  <rect x="225" y="444" width="85" height="32" rx="5" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1"/>
  <text x="267" y="458" text-anchor="middle" fill="#1565c0" font-size="8.5">/api/proofread</text>
  <text x="267" y="470" text-anchor="middle" fill="#1976d2" font-size="7.5">AI校正</text>

  <rect x="320" y="444" width="100" height="32" rx="5" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1"/>
  <text x="370" y="458" text-anchor="middle" fill="#1565c0" font-size="8.5">/api/amplify/status</text>
  <text x="370" y="470" text-anchor="middle" fill="#1976d2" font-size="7.5">ビルド監視</text>

  <!-- Auth row -->
  <rect x="35" y="486" width="160" height="28" rx="5" fill="#fce4ec" stroke="#ef9a9a" stroke-width="1"/>
  <text x="115" y="500" text-anchor="middle" fill="#c62828" font-size="8.5">認証（パスワード + HMAC Cookie）</text>

  <rect x="205" y="486" width="60" height="28" rx="5" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1"/>
  <text x="235" y="504" text-anchor="middle" fill="#1565c0" font-size="8.5">/api/tags</text>

  <rect x="275" y="486" width="100" height="28" rx="5" fill="#fce4ec" stroke="#f48fb1" stroke-width="1"/>
  <text x="325" y="500" text-anchor="middle" fill="#880e4f" font-size="8.5">Middleware 認証</text>

  <!-- Libraries label -->
  <text x="35" y="532" fill="#666" font-size="10" font-style="italic">Libraries</text>

  <!-- Library boxes -->
  <rect x="35" y="540" width="100" height="36" rx="5" fill="#ede7f6" stroke="#9575cd" stroke-width="1"/>
  <text x="85" y="556" text-anchor="middle" fill="#4527a0" font-size="9.5" font-weight="bold">Octokit</text>
  <text x="85" y="569" text-anchor="middle" fill="#7e57c2" font-size="8">GitHub API</text>

  <rect x="150" y="540" width="120" height="36" rx="5" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1"/>
  <text x="210" y="556" text-anchor="middle" fill="#6a1b9a" font-size="9.5" font-weight="bold">Anthropic SDK</text>
  <text x="210" y="569" text-anchor="middle" fill="#9c27b0" font-size="8">Claude Sonnet</text>

  <rect x="285" y="540" width="110" height="36" rx="5" fill="#fff3e0" stroke="#ffb74d" stroke-width="1"/>
  <text x="340" y="556" text-anchor="middle" fill="#e65100" font-size="9.5" font-weight="bold">AWS SDK</text>
  <text x="340" y="569" text-anchor="middle" fill="#f57c00" font-size="8">Amplify Client</text>

  <!-- ============ External Services ============ -->

  <!-- GitHub -->
  <rect x="540" y="270" width="150" height="70" rx="35" fill="#24292e" filter="url(#shadow)"/>
  <text x="615" y="302" text-anchor="middle" fill="white" font-size="13" font-weight="bold">GitHub</text>
  <text x="615" y="318" text-anchor="middle" fill="#aaa" font-size="9">リポジトリ</text>

  <!-- AWS Amplify astro-blog -->
  <g transform="translate(740, 80)">
    <rect x="0" y="0" width="180" height="60" rx="8" fill="#FF9900" filter="url(#shadow)"/>
    <text x="90" y="26" text-anchor="middle" fill="white" font-size="11" font-weight="bold">AWS Amplify</text>
    <text x="90" y="44" text-anchor="middle" fill="#fff3e0" font-size="9.5">(astro-blog)</text>
  </g>

  <!-- AWS Amplify blog-editor -->
  <g transform="translate(740, 440)">
    <rect x="0" y="0" width="180" height="60" rx="8" fill="#FF9900" filter="url(#shadow)"/>
    <text x="90" y="26" text-anchor="middle" fill="white" font-size="11" font-weight="bold">AWS Amplify</text>
    <text x="90" y="44" text-anchor="middle" fill="#fff3e0" font-size="9.5">(blog-editor)</text>
  </g>

  <!-- Claude API -->
  <rect x="560" y="570" width="140" height="50" rx="8" fill="#D4A574" filter="url(#shadow)"/>
  <text x="630" y="599" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Claude API</text>

  <!-- Public site -->
  <g transform="translate(740, 170)">
    <rect x="0" y="0" width="180" height="55" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="24" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="bold">公開サイト</text>
    <text x="90" y="42" text-anchor="middle" fill="#388e3c" font-size="9">(静的ホスティング)</text>
  </g>

  <!-- blog-editor site -->
  <g transform="translate(740, 530)">
    <rect x="0" y="0" width="180" height="55" rx="8" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="24" text-anchor="middle" fill="#1565c0" font-size="11" font-weight="bold">blog-editor Web UI</text>
    <text x="90" y="42" text-anchor="middle" fill="#1976d2" font-size="9">(Amplify Hosting)</text>
  </g>

  <!-- ============ Actors ============ -->

  <!-- Reader -->
  <g transform="translate(830, 260)">
    <circle cx="20" cy="10" r="10" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5"/>
    <line x1="20" y1="20" x2="20" y2="42" stroke="#1976d2" stroke-width="1.5"/>
    <line x1="5" y1="30" x2="35" y2="30" stroke="#1976d2" stroke-width="1.5"/>
    <line x1="20" y1="42" x2="8" y2="58" stroke="#1976d2" stroke-width="1.5"/>
    <line x1="20" y1="42" x2="32" y2="58" stroke="#1976d2" stroke-width="1.5"/>
    <text x="20" y="73" text-anchor="middle" fill="#1565c0" font-size="10" font-weight="bold">読者</text>
  </g>

  <!-- Admin -->
  <g transform="translate(830, 600)">
    <circle cx="20" cy="10" r="10" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
    <line x1="20" y1="20" x2="20" y2="42" stroke="#7b1fa2" stroke-width="1.5"/>
    <line x1="5" y1="30" x2="35" y2="30" stroke="#7b1fa2" stroke-width="1.5"/>
    <line x1="20" y1="42" x2="8" y2="58" stroke="#7b1fa2" stroke-width="1.5"/>
    <line x1="20" y1="42" x2="32" y2="58" stroke="#7b1fa2" stroke-width="1.5"/>
    <text x="20" y="73" text-anchor="middle" fill="#6a1b9a" font-size="10" font-weight="bold">管理者</text>
  </g>

  <!-- ============ Arrows ============ -->

  <!-- Reader -> Public site -->
  <line x1="830" y1="290" x2="830" y2="230" stroke="#1976d2" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="838" y="264" fill="#1976d2" font-size="8.5">閲覧</text>

  <!-- Admin -> blog-editor site -->
  <line x1="850" y1="600" x2="850" y2="590" stroke="#9C27B0" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="858" y="598" fill="#7b1fa2" font-size="8.5">記事管理</text>

  <!-- blog-editor Octokit -> GitHub -->
  <path d="M 440 558 L 490 558 L 490 305 L 540 305" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="497" y="440" fill="#555" font-size="8.5">記事 CRUD</text>
  <text x="497" y="452" fill="#555" font-size="8.5">画像アップロード</text>

  <!-- blog-editor AWS SDK -> Amplify (astro-blog) status polling -->
  <path d="M 395 558 L 450 558 L 450 380 L 700 380 L 700 120 L 740 120" fill="none" stroke="#FF9900" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <text x="705" y="260" fill="#e65100" font-size="8">ビルドステータス</text>
  <text x="705" y="272" fill="#e65100" font-size="8">ポーリング</text>

  <!-- blog-editor Anthropic SDK -> Claude API -->
  <path d="M 270 558 L 270 595 L 560 595" fill="none" stroke="#D4A574" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="380" y="590" fill="#8d6e63" font-size="8.5">AI校正リクエスト</text>

  <!-- GitHub -> Amplify (astro-blog) push trigger -->
  <path d="M 690 290 L 720 290 L 720 110 L 740 110" fill="none" stroke="#FF9900" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="728" y="200" fill="#e65100" font-size="8.5" font-weight="bold">push</text>
  <text x="728" y="212" fill="#e65100" font-size="8.5" font-weight="bold">トリガー</text>

  <!-- GitHub -> Amplify (blog-editor) push trigger -->
  <path d="M 690 320 L 710 320 L 710 470 L 740 470" fill="none" stroke="#FF9900" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>

  <!-- Amplify (astro-blog) -> Public site -->
  <line x1="830" y1="140" x2="830" y2="170" stroke="#FF9900" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="838" y="160" fill="#e65100" font-size="8.5">デプロイ</text>

  <!-- Amplify (blog-editor) -> blog-editor site -->
  <line x1="830" y1="500" x2="830" y2="530" stroke="#FF9900" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="838" y="520" fill="#e65100" font-size="8.5">デプロイ</text>

  <!-- astro-blog dist -> Amplify -->
  <path d="M 425 248 L 480 248 L 480 110 L 740 110" fill="none" stroke="#66BB6A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="488" y="180" fill="#2e7d32" font-size="8.5">ビルド成果物</text>

  <!-- ============ Legend ============ -->
  <g transform="translate(540, 610)">
    <rect x="0" y="0" width="180" height="58" rx="6" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <text x="10" y="16" fill="#333" font-size="9" font-weight="bold">凡例</text>
    <line x1="10" y1="28" x2="30" y2="28" stroke="#888" stroke-width="1.5"/>
    <text x="35" y="32" fill="#666" font-size="8">データフロー</text>
    <line x1="100" y1="28" x2="120" y2="28" stroke="#FF9900" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="125" y="32" fill="#666" font-size="8">デプロイ/監視</text>
    <line x1="10" y1="46" x2="30" y2="46" stroke="#66BB6A" stroke-width="1.5"/>
    <text x="35" y="50" fill="#666" font-size="8">ビルド出力</text>
    <line x1="100" y1="46" x2="120" y2="46" stroke="#FF9900" stroke-width="1.5"/>
    <text x="125" y="50" fill="#666" font-size="8">CI/CD トリガー</text>
  </g>

</svg>